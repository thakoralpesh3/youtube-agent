name: 24/7 Cloud Scheduler & Watchdog Daemon

on:
  schedule:
    # Hourly 24/7 Watchdog Heartbeat (at minute 0 of every hour)
    - cron: '0 * * * *'
  repository_dispatch:
    types: [cloud_heartbeat, trigger_scheduler]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (evaluate state without dispatching actions)'
        required: false
        default: false
        type: boolean
      force_youtube:
        description: 'Force immediate YouTube Agent workflow dispatch'
        required: false
        default: false
        type: boolean
      force_social:
        description: 'Force immediate Social Agent workflow dispatch'
        required: false
        default: false
        type: boolean
      clean_channel:
        description: 'Execute YouTube stuck video cleaner & audit'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: cloud-scheduler-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: 24/7 Autonomous Watchdog & Dispatch Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Fonts
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # 1. Populate .env file
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "GEMINI_MODEL=gemini-3.1-flash-lite" >> .env
            echo "YOUTUBE_PRIVACY_STATUS=public" >> .env
            echo "DEFAULT_NICHE=High-Performance Growth Mindset, Stoic Philosophy, Health & Fitness Science, Mental Resilience, and Peak Daily Discipline" >> .env
            echo "YOUTUBE_CATEGORY_ID=27" >> .env
          fi

          # 2. Restore client_secret.json if secret is configured
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          fi

          # 3. Restore token.json to root and output/
          mkdir -p output
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > token.json
            echo "$YOUTUBE_TOKEN_JSON" > output/token.json
            echo "YOUTUBE_TOKEN_FILE=token.json" >> .env
          fi

      - name: Execute Autonomous Watchdog Cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NON_INTERACTIVE: "1"
        run: |
          ARGS=(--heartbeat)

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "${{ github.event.inputs.force_youtube }}" = "true" ]; then
            ARGS+=(--force-youtube)
          fi

          if [ "${{ github.event.inputs.force_social }}" = "true" ]; then
            ARGS+=(--force-social)
          fi

          if [ "${{ github.event.inputs.clean_channel }}" = "true" ]; then
            ARGS+=(--clean-channel)
          fi

          echo "🚀 Running Cloud Scheduler: python3 core/cloud_scheduler.py ${ARGS[*]}"
          python3 core/cloud_scheduler.py "${ARGS[@]}"

      - name: Sweep & Recover Un-Uploaded Queue Leftovers
        if: always()
        env:
          NON_INTERACTIVE: "1"
        run: |
          echo "🧹 Sweeping un-uploaded videos in output/..."
          python3 upload_to_youtube.py || true

      - name: Archive Watchdog State
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-watchdog-report-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            output/summary.json
            output/autostart.log
          retention-days: 7
