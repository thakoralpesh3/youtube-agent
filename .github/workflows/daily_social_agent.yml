name: Daily Social Media Agent Workflow

on:
  schedule:
    # Sharp 11:30 PM IST (Indian Standard Time, UTC+5:30) = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      content_source:
        description: 'Content Source for Stories'
        required: true
        default: 'generate'
        type: choice
        options:
          - 'generate'
          - 'post_folder'
          - 'both'
      topic:
        description: 'Custom Topic for Generated Stories (leave empty for autonomous pillar selection)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run Mode (generate stories without publishing)'
        required: false
        default: false
        type: boolean

jobs:
  run-social-agent:
    name: Execute Daily Social Media Story Creation & Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-cjk \
            fonts-dejavu-core \
            fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials & Secrets from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
        run: |
          # 1. Populate .env file
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "GEMINI_MODEL=gemini-4-argon" >> .env
            echo "DEFAULT_NICHE=High-Performance Growth Mindset, Stoic Philosophy, Health & Fitness Science, Mental Resilience, and Peak Daily Discipline" >> .env
            echo "SOCIAL_DAILY_UPLOAD_TIME=23:30" >> .env
            echo "SOCIAL_DAILY_POST_LIMIT=1" >> .env
          else
            echo "⚠️ Warning: GEMINI_API_KEY secret is not set in GitHub repository settings!"
          fi

          # 2. Restore social_credentials.json if secret is configured
          if [ -n "$SOCIAL_CREDENTIALS_JSON" ]; then
            echo "$SOCIAL_CREDENTIALS_JSON" > social_credentials.json
            echo "✅ social_credentials.json restored from GitHub Secrets"
          fi

      - name: Verify Social Account Connection & Diagnostics
        run: |
          python3 -c "
          from syndication.social_auth import SocialAuth
          sa = SocialAuth()
          print('============================================================')
          print('🌐 SOCIAL MEDIA ACCOUNTS DIAGNOSTIC AUDIT')
          print('============================================================')
          print(f'📸 Instagram Ready : {sa.is_instagram_ready()}')
          print(f'📘 Facebook Ready  : {sa.is_facebook_ready()}')
          print(f'💬 WhatsApp Ready  : {sa.is_whatsapp_ready()}')
          print('============================================================')
          "

      - name: Execute Autonomous Social Media Stories Agent
        env:
          NON_INTERACTIVE: "1"
        run: |
          CMD_ARGS="--trilingual --force --platform social"

          # Determine dry-run mode
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi

          # Determine custom topic
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            CMD_ARGS="$CMD_ARGS --topic \"$TOPIC\""
          fi

          SOURCE="${{ github.event.inputs.content_source || 'generate' }}"

          if [ "$SOURCE" = "generate" ] || [ "$SOURCE" = "both" ]; then
            echo "🚀 Executing Social Media AI Generation: python3 agent.py $CMD_ARGS"
            python3 agent.py $CMD_ARGS
          fi

          if [ "$SOURCE" = "post_folder" ] || [ "$SOURCE" = "both" ]; then
            echo "📁 Processing & Publishing from Story Drop Folder..."
            python3 -m syndication.social_manager --publish-pending || true
          fi

      - name: Archive Generated Social Stories & Summaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-social-output-${{ github.run_id }}
          path: |
            output/stories/**
            output/run_*
            output/social_daily_tracker.json
            output/social_history.json
          retention-days: 14
