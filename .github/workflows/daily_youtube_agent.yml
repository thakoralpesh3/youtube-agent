name: Daily YouTube Agent Workflow

on:
  schedule:
    # Sharp 09:00 AM IST (Indian Standard Time, UTC+5:30) = 03:30 AM UTC
    - cron: '30 3 * * *'
  repository_dispatch:
    types: [daily_run, trigger_agent]
  workflow_call:
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content Format to Generate & Upload'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'shorts'
          - 'videos'
      topic:
        description: 'Custom Topic (leave empty for autonomous pillar selection)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run Mode (generate videos without uploading)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  run-agent:
    name: Execute Daily YouTube Content Creation & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deduplicate Scheduled Execution
        id: deduplicate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking if daily YouTube workflow already executed today..."
          TODAY=$(date -u +%Y-%m-%d)
          PREV_SUCCESS=$(gh run list --workflow=daily_youtube_agent.yml -s success --json createdAt,databaseId --jq ".[] | select(.databaseId != ${{ github.run_id }} and (.createdAt | startswith(\"$TODAY\"))) | .databaseId" | head -n 1 || true)
          if [ -n "$PREV_SUCCESS" ]; then
            echo "✨ Daily YouTube run already completed today (Run ID: $PREV_SUCCESS). Skipping delayed schedule."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No prior run today. Proceeding with daily upload."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials & Secrets from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # 1. Populate .env file
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "GEMINI_MODEL=gemini-3.1-flash-lite" >> .env
            echo "YOUTUBE_PRIVACY_STATUS=public" >> .env
            echo "DEFAULT_NICHE=High-Performance Growth Mindset, Stoic Philosophy, Health & Fitness Science, Mental Resilience, and Peak Daily Discipline" >> .env
            echo "YOUTUBE_CATEGORY_ID=27" >> .env
          else
            echo "⚠️ Warning: GEMINI_API_KEY secret is not set in GitHub repository settings!"
          fi

          # 2. Restore client_secret.json if secret is configured
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
            echo "✅ client_secret.json restored from GitHub Secrets"
          fi

          # 3. Restore token.json to root and output/ if secret is configured
          mkdir -p output
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > token.json
            echo "$YOUTUBE_TOKEN_JSON" > output/token.json
            echo "YOUTUBE_TOKEN_FILE=token.json" >> .env
            echo "✅ token.json restored to root and output/ from GitHub Secrets"
          fi

      - name: Verify YouTube Channel Connection & Diagnostics
        if: steps.deduplicate.outputs.skip != 'true'
        run: |
          python3 -c "
          from youtube.auth import YouTubeAuth
          auth = YouTubeAuth()
          if auth.is_token_valid():
              ch = auth.verify_channel()
              print(f'🎉 YouTube Channel Connected: {ch.get(\"title\")} ({ch.get(\"subscribers\")} subscribers, {ch.get(\"videos\")} videos)')
          else:
              print('⚠️ YouTube token validation notice. Agent will generate and queue content safely.')
          "

      - name: Execute Autonomous YouTube Content Creator Agent
        if: steps.deduplicate.outputs.skip != 'true'
        env:
          NON_INTERACTIVE: "1"
        run: |
          CMD_ARGS=(--trilingual --force --platform youtube)

          # Determine content type
          CONTENT_TYPE="${{ github.event.inputs.content_type || 'both' }}"
          CMD_ARGS+=(--content-type "$CONTENT_TYPE")

          # Determine dry-run mode
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS+=(--dry-run)
          fi

          # Determine custom topic
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            CMD_ARGS+=(--topic "$TOPIC")
          fi

          echo "🚀 Executing YouTube Agent: python3 agent.py ${CMD_ARGS[*]}"
          python3 agent.py "${CMD_ARGS[@]}"

      - name: Sweep & Auto-Upload Any Leftover Videos
        if: steps.deduplicate.outputs.skip != 'true' && (success() || failure())
        env:
          NON_INTERACTIVE: "1"
        run: |
          echo "🧹 Sweeping and uploading any remaining generated videos to YouTube..."
          python3 upload_to_youtube.py || true

      - name: Archive Generated Videos & Summaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-youtube-output-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            output/run_*
            output/summary.json
            output/topic_history.json
          retention-days: 14
