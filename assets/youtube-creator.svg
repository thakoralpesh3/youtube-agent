<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#33334d" stroke-width="4" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="12 8" />

  <!-- YouTube Play Plaque -->
  <rect x="96" y="146" width="320" height="220" rx="55" fill="url(#ytGrad)" filter="url(#glow)" />

  <!-- Play Triangle -->
  <polygon points="226,206 226,306 316,256" fill="#FFFFFF" />

  <!-- AI Sparkles / Brain nodes in corners -->
  <!-- Top Right Sparkle -->
  <path d="M400,90 L408,115 L433,123 L408,131 L400,156 L392,131 L367,123 L392,115 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  <circle cx="435" cy="85" r="5" fill="#FFD700" />
  
  <!-- Bottom Left Tech Sparkle -->
  <path d="M100,380 L106,398 L124,404 L106,410 L100,428 L94,410 L76,404 L94,398 Z" fill="url(#cyanGrad)" />

  <!-- Upload Arrow Indicator at bottom right of plaque -->
  <circle cx="380" cy="340" r="38" fill="#1e1e2f" stroke="#00F0FF" stroke-width="4" />
  <path d="M380,322 L368,336 L376,336 L376,356 L384,356 L384,336 L392,336 Z" fill="#00F0FF" />
</svg>
