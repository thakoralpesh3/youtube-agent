version: "3.8"

services:
  youtube-agent:
    build: .
    container_name: youtube_social_agent_247
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - HEADLESS_BROWSER=1
      - WEB_SERVER_PORT=8080
      - WEB_SERVER_HOST=0.0.0.0
    volumes:
      # Preserve generated videos and logs
      - ./output:/app/output
      # Hot-drop folder for Stories (IG, FB, WA)
      - ./Story:/app/Story
      # Persistent browser logins (WhatsApp Web, Instagram, Facebook sessions)
      - ./assets/browser_profiles:/app/assets/browser_profiles
      # Credentials & API keys
      - ./.env:/app/.env:ro
      - ./client_secret.json:/app/client_secret.json:ro
      - ./token.json:/app/token.json
      - ./social_credentials.json:/app/social_credentials.json
    shm_size: "2gb" # Prevent Firefox crashes on intensive rendering
